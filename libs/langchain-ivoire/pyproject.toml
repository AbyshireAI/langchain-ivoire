[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "langchain-ivoire"
version = "0.1.0a3"
description = "LangChain integration for Ivorian languages (Baoulé first): speech recognition, translation, speech synthesis, a language wrapper for any chat model and a voice agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abyshire Technology Ltd" }]
requires-python = ">=3.10"
keywords = ["langchain", "langgraph", "baoule", "bci", "cote-d-ivoire", "speech", "translation", "low-resource-languages"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: French",
    "Typing :: Typed",
]
dependencies = [
    "langchain>=1.4,<2",
    "langchain-core>=1.6,<2",
    "langgraph>=1.2,<2",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/AbyshireAI/langchain-ivoire"
Documentation = "https://github.com/AbyshireAI/langchain-ivoire/tree/main/libs/langchain-ivoire#readme"
Source = "https://github.com/AbyshireAI/langchain-ivoire"
Issues = "https://github.com/AbyshireAI/langchain-ivoire/issues"
Changelog = "https://github.com/AbyshireAI/langchain-ivoire/blob/main/CHANGELOG.md"

[project.scripts]
ivoire-mcp = "langchain_ivoire.mcp_server:main"

[project.optional-dependencies]
# MCP server (`ivoire-mcp`), built on the official MCP Python SDK.
mcp = ["mcp>=2.3,<3"]

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "pytest-cov>=5",
    "respx>=0.22",
    "langchain-tests>=1.1,<2",
    "jsonschema>=4.18",
]
lint = ["ruff>=0.8"]
typing = ["mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_ivoire"]
# private model settings never ship (they are also git-ignored)
exclude = ["*.private.json", "ivoire-settings*.json", "**/settings.json"]

[tool.hatch.build.targets.sdist]
include = ["langchain_ivoire", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["*.private.json", "ivoire-settings*.json", "**/settings.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "T201"]
ignore = ["RUF001", "RUF002", "RUF003", "UP007", "E501"]  # line length: enforced by ruff format for code

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"examples/**" = ["T201", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
exclude = ["examples/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: calls a running server (LAN demo by default); skipped when unreachable",
]
addopts = "--strict-markers"

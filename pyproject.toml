[project]
name = "langchain-ivoire-workspace"
version = "0"
requires-python = ">=3.10"
description = "uv workspace root (not published)"
dependencies = []

[tool.uv.workspace]
members = ["libs/langchain-ivoire"]

[tool.uv.sources]
langchain-ivoire = { workspace = true }

[dependency-groups]
# CI: `uv sync --group test` (core), `--group test --group mcp` (with the [mcp] extra).
test = [
    "langchain-ivoire",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "pytest-cov>=5",
    "respx>=0.22",
    "langchain-tests>=1.1,<2",
    "jsonschema>=4.18",  # API contract tests (referencing-based $ref resolution)
]
mcp = ["langchain-ivoire[mcp]"]
lint = ["ruff>=0.8", "mypy>=1.13", "langchain-ivoire[mcp]"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
dev = [
    { include-group = "test" },
    { include-group = "mcp" },
    { include-group = "lint" },
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["libs", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["benchmarks"]
addopts = "--strict-markers"
